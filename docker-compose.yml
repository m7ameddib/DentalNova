services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentalnova-app
    env_file:
      - .env
    environment:
      DEPLOYMENT_MODE: online
      NODE_ENV: production
      SERVE_CLIENT: "1"
      DNT_DATA_DIR: /data
      MIGRATIONS_DIR: /app/database/migrations
      HOST: 0.0.0.0
      PORT: "4000"
    volumes:
      - dentalnova-data:/data
    restart: unless-stopped
    networks:
      - dentalnova
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: dentalnova-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-dentalnova.dibnova.com}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dentalnova

volumes:
  dentalnova-data:
    name: dentalnova-data
  caddy-data:
    name: dentalnova-caddy-data
  caddy-config:
    name: dentalnova-caddy-config

networks:
  dentalnova:
    name: dentalnova
