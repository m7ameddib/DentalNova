name: Release Offline Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 1.1.4)'
        required: true

permissions:
  contents: write

jobs:
  release-offline:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'.Trim()
          } else {
            $v = '${{ github.ref_name }}' -replace '^v',''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $v"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $v"

      - name: Sync version files
        shell: pwsh
        run: ./release/scripts/sync-version.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Seed test database
        run: npm run seed
        env:
          DEPLOYMENT_MODE: offline

      - name: Prune dev dependencies for release packaging
        run: npm prune --omit=dev

      - name: Install portable Node.js 22 runtime for offline package
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'nodejs-portable\node-v22.23.2-win-x64'
          if (Test-Path (Join-Path $dest 'node.exe')) {
            Write-Host "Portable Node already present at $dest"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'node-v22.23.2-win-x64.zip'
          Write-Host 'Downloading Node.js 22 portable runtime...'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Move-Item -Force (Join-Path $env:RUNNER_TEMP 'node-v22.23.2-win-x64') $dest
          Write-Host "Portable Node installed at $dest"

      - name: Build offline release package and installer
        shell: pwsh
        run: ./release/scripts/build-release.ps1 -Version ${{ steps.version.outputs.version }} -RequireInstaller

      - name: Verify clinic.db safety (install/update simulation)
        shell: pwsh
        run: ./release/scripts/test-install-update.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Verify license key rotation compatibility
        run: npm run release:test-licensing && npm run release:test-license-rotation

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DentalNova Offline v${{ steps.version.outputs.version }}
          overwrite_files: true
          body: |
            Official offline Windows installer for DentalNova Main Clinic.

            **Install / update**
            1. In DentalNova: Settings → Updates → Check for Updates → Download → Run installer
            2. Or download `DNT-Dental-Main-Clinic-Setup-v${{ steps.version.outputs.version }}.exe` below and choose **Update Existing Installation**

            **Data safety:** The installer replaces application files under Program Files only. It never deletes or overwrites `C:\ProgramData\DibNova\DNTDental\data\clinic.db` or other clinic data.
          files: |
            release/DNT-Dental-v${{ steps.version.outputs.version }}/DNT-Dental-Main-Clinic-Setup-v${{ steps.version.outputs.version }}.exe
            release/DNT-Dental-v${{ steps.version.outputs.version }}/DNT-Dental-Main-Clinic-Setup-v${{ steps.version.outputs.version }}.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
